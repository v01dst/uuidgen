[project]
name = "uuidgen"
version = "0.1.0"
description = "Generate and inspect UUIDs from your terminal. Zero dependencies, pure Python stdlib."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Mahmoud Ahmed" }]

[project.scripts]
uuidgen = "uuidgen:main"

[tool.pytest.ini_options]
testpaths = ["tests"]